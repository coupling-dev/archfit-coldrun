name: archfit
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: archfit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == "pull_request" }}

jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install archfit 0.9.0
        run: |
          B=https://github.com/coupling-dev/archfit/releases/download/v0.9.0
          curl -fsSLO "$B/archfit-v0.9.0-linux-amd64"
          curl -fsSLO "$B/SHA256SUMS"
          grep " archfit-v0.9.0-linux-amd64$" SHA256SUMS | sha256sum -c -
          install -m 0755 archfit-v0.9.0-linux-amd64 "$HOME/.local/bin/archfit"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: archfit check
        run: archfit check --base "origin/${{ github.base_ref }}"
